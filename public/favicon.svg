<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* oklch is not reliably supported in SVG rendered as an image resource
       (e.g., favicons). Hex is declared first as a fallback; browsers that
       support oklch override it via the cascade. */
    rect { fill: #272727; fill: oklch(0.2727 0 0); }
  </style>
  <rect width="64" height="64" rx="12"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">PB</text>
</svg>
